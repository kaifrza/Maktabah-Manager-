name: Build Maktabah Manager Native APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK as a GitHub Release
        required: false
        type: boolean
        default: true

  push:
    branches:
      - main
      - master
    paths:
      - "**.zip"
      - "native-android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: maktabah-manager-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_ID: ${{ vars.APP_ID || 'com.krurdu.manager' }}
  APP_NAME: "Maktabah Manager"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.10.2"

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      #
      # IMPORTANT:
      # Do NOT enable Gradle cache here.
      # The generated Gradle project does not exist at repository
      # checkout time.
      # ============================================================

      - name: Setup Java 17
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify Java
        id: verify_java
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Java environment"
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "::endgroup::"

          {
            echo "## ☕ Java"
            echo
            echo "- Distribution: Eclipse Temurin"
            echo "- Version: Java 17"
            echo "- Status: ✅ Ready"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 3. ANDROID SDK SETUP
      #
      # IMPORTANT:
      # Do NOT request the obsolete "tools" package.
      # ============================================================

      - name: Setup Android SDK
        id: android_sdk
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      # ============================================================
      # 4. INSTALL REQUIRED SDK COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        id: sdk_components
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$RUNNER_TEMP/sdk-install.log"

          echo "::group::Android SDK installation"

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}

          echo "::endgroup::"

          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## ❌ Android SDK installation failed"
              echo
              echo "**Stage:** Install Android SDK components"
              echo
              echo "**Requested:**"
              echo "- platform-tools"
              echo "- platforms;android-${ANDROID_API}"
              echo "- build-tools;${BUILD_TOOLS}"
              echo
              echo "**Last 30 lines:**"
              echo '```text'
              tail -30 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$STATUS"
          fi

          {
            echo "## 📦 Android SDK"
            echo
            echo "- Platform: Android ${ANDROID_API}"
            echo "- Build Tools: ${BUILD_TOOLS}"
            echo "- Platform Tools: installed"
            echo "- Status: ✅ Ready"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 5. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        id: verify_sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Android SDK environment"

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo
          echo "sdkmanager:"
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "adb:"
          command -v adb
          adb version

          echo
          echo "Android platform:"
          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"

          echo
          echo "Build tools:"
          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          echo "::endgroup::"

          echo "Android SDK verification: PASSED"


      # ============================================================
      # 6. FIND AND EXTRACT MANAGER ZIP
      # ============================================================

      - name: Extract Manager source
        id: extract_source
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf _src _app
          mkdir -p _src

          echo "::group::Locate Manager ZIP"

          mapfile -t ZIPS < <(
            find . \
              -type f \
              -name 'KR_Urdu_Library_Manager_*.zip' \
              -not -path './_src/*' \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No Manager ZIP found."
            echo "::endgroup::"

            {
              echo "## ❌ Source ZIP not found"
              echo
              echo "Expected:"
              echo "\`KR_Urdu_Library_Manager_*.zip\`"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          ZIP="${ZIPS[${#ZIPS[@]}-1]}"

          echo "Selected ZIP:"
          echo "$ZIP"

          echo "::endgroup::"


          echo "::group::Extract source"

          unzip -q "$ZIP" -d _src

          IDX="$(
            find _src \
              -type f \
              -path '*/manager/index.html' \
              -not -path '*/node_modules/*' \
              | head -1
          )"

          if [ -z "$IDX" ]; then
            echo "ERROR: manager/index.html was not found."
            echo "::endgroup::"

            {
              echo "## ❌ Invalid Manager ZIP"
              echo
              echo "The ZIP does not contain the expected:"
              echo "\`manager/index.html\`"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          SRC_ROOT="$(dirname "$(dirname "$IDX")")"

          echo "SRC_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"

          echo "Source root:"
          echo "$SRC_ROOT"

          echo "::endgroup::"


      # ============================================================
      # 7. PREPARE NATIVE PROJECT
      # ============================================================

      - name: Prepare native Android project
        id: prepare_project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Copy native project"

          cp -R native-android _app

          mkdir -p \
            _app/app/src/main/assets/www

          echo "::endgroup::"


          echo "::group::Copy Manager web application"

          rsync -a \
            --exclude 'supabase' \
            "$SRC_ROOT/manager/" \
            _app/app/src/main/assets/www/

          echo "::endgroup::"


          echo "::group::Configure application ID"

          sed -i \
            "s/__APP_ID__/$APP_ID/g" \
            _app/app/build.gradle.kts \
            _app/app/src/main/AndroidManifest.xml

          PKG_PATH="$(echo "$APP_ID" | tr '.' '/')"

          mkdir -p \
            "_app/app/src/main/java/$PKG_PATH"

          mv \
            _app/app/src/main/java/com/krurdu/manager/MainActivity.kt \
            "_app/app/src/main/java/$PKG_PATH/MainActivity.kt"

          sed -i \
            "s/^package com\.krurdu\.manager/package $APP_ID/" \
            "_app/app/src/main/java/$PKG_PATH/MainActivity.kt"

          echo "Application ID: $APP_ID"
          echo "Package path: $PKG_PATH"

          echo "::endgroup::"


      # ============================================================
      # 8. GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        id: gradle_wrapper
        working-directory: _app
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Generate Gradle wrapper"

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper:"
          ./gradlew --version

          echo "::endgroup::"


      # ============================================================
      # 9. GRADLE SETUP / CACHE
      #
      # This is intentionally AFTER the native Gradle project
      # and wrapper have been created.
      # ============================================================

      - name: Setup Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 10. STATIC VERIFICATION
      # ============================================================

      - name: Static project verification
        id: static_check
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Locate native project files"

          MANIFEST="_app/app/src/main/AndroidManifest.xml"

          ACTIVITY="$(
            find _app/app/src/main/java \
              -type f \
              -name 'MainActivity.kt' \
              | head -1
          )"

          WEB_DIR="_app/app/src/main/assets/www"

          test -f "$MANIFEST"
          test -n "$ACTIVITY"

          echo "Manifest:"
          echo "$MANIFEST"

          echo "Activity:"
          echo "$ACTIVITY"

          echo "::endgroup::"


          echo "::group::Native Android checks"

          grep -q \
            'USE_BIOMETRIC' \
            "$MANIFEST"

          grep -q \
            'BiometricPrompt' \
            "$ACTIVITY"

          grep -q \
            'installSplashScreen' \
            "$ACTIVITY"

          echo "Native checks: PASSED"

          echo "::endgroup::"


          echo "::group::Web application checks"

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/applock.js"
          test -f "$WEB_DIR/native-shell.js"

          grep -q \
            'androidBridge' \
            "$WEB_DIR/applock.js"

          grep -q \
            'androidBridge' \
            "$WEB_DIR/native-shell.js"

          node --check \
            "$WEB_DIR/applock.js"

          node --check \
            "$WEB_DIR/native-shell.js"

          echo "Web checks: PASSED"

          echo "::endgroup::"


          echo "::group::Branding checks"

          test -f \
            "_app/app/src/main/res/drawable/mk_icon.png"

          test -f \
            "_app/app/src/main/res/drawable/mk_splash.png"

          test -f \
            "$WEB_DIR/native-splash.png"

          echo "Branding resources: PASSED"

          echo "::endgroup::"


          {
            echo "## 🔍 Static verification"
            echo
            echo "- Native Android files: ✅"
            echo "- Biometric integration: ✅"
            echo "- Splash integration: ✅"
            echo "- Web JavaScript syntax: ✅"
            echo "- Branding resources: ✅"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 11. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        id: build_apk
        working-directory: _app
        shell: bash
        run: |
          set -o pipefail

          LOG="$RUNNER_TEMP/gradle-build.log"

          echo "::group::Gradle APK build"

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}

          echo "::endgroup::"

          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## ❌ Gradle APK build failed"
              echo
              echo "**Stage:** \`assembleDebug\`"
              echo
              echo "**Exit code:** $STATUS"
              echo
              echo "### Last 50 lines"
              echo '```text'
              tail -50 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$STATUS"
          fi


      # ============================================================
      # 12. FIND APK
      # ============================================================

      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(
            find _app/app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              | head -1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            {
              echo "## ❌ APK not found"
              echo
              echo "Gradle completed, but no APK was found."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "Generated APK:"
          echo "$APK"


      # ============================================================
      # 13. APK VERIFICATION
      # ============================================================

      - name: Verify APK
        id: verify_apk
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::Find AAPT"

          AAPT="$(
            find "$ANDROID_SDK_ROOT/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -1
          )"

          test -n "$AAPT"

          echo "AAPT:"
          echo "$AAPT"

          echo "::endgroup::"


          echo "::group::APK package verification"

          "$AAPT" dump badging "$APK" \
            | tee /tmp/badging.txt

          grep -q \
            "package: name='$APP_ID'" \
            /tmp/badging.txt

          grep -q \
            "application-label:'Maktabah Manager'" \
            /tmp/badging.txt

          echo "Package ID: PASSED"
          echo "Application label: PASSED"

          echo "::endgroup::"


          echo "::group::APK web assets verification"

          unzip -l "$APK" \
            | grep -q \
            'assets/www/index.html'

          unzip -l "$APK" \
            | grep -q \
            'assets/www/applock.js'

          unzip -l "$APK" \
            | grep -q \
            'assets/www/native-shell.js'

          echo "Web assets: PASSED"

          echo "::endgroup::"


          echo "::group::Create final APK"

          mkdir -p dist

          OUT="Maktabah-Manager-native-v1.0.${GITHUB_RUN_NUMBER}.apk"

          cp "$APK" \
            "dist/$OUT"

          SHA256="$(
            sha256sum "dist/$OUT" \
              | cut -d' ' -f1
          )"

          echo "APK_FILE=dist/$OUT" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "APK_SHA=$SHA256" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$OUT"

          echo "SHA-256:"
          echo "$SHA256"

          echo "::endgroup::"


          {
            echo "## ✅ APK verification passed"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Application | Maktabah Manager |"
            echo "| Package | \`$APP_ID\` |"
            echo "| Android API | \`$ANDROID_API\` |"
            echo "| Build Tools | \`$BUILD_TOOLS\` |"
            echo "| APK | \`$OUT\` |"
            echo "| SHA-256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 15. PUBLISH RELEASE
      # ============================================================

      - name: Publish GitHub Release
        id: release
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-native-build-${{ github.run_number }}
          name: Maktabah Manager Native v1.0.${{ github.run_number }}
          body: |
            ## Maktabah Manager — Native Android

            Native Kotlin Android build.

            **Application:** Maktabah Manager

            **Package:** ${{ env.APP_ID }}

            **Android API:** ${{ env.ANDROID_API }}

            **Build Tools:** ${{ env.BUILD_TOOLS }}

            **SHA-256:**
            ${{ env.APK_SHA }}
          files: ${{ env.APK_FILE }}
          make_latest: true
