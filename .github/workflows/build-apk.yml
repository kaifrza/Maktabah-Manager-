name: Build Maktabah Manager Native APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK as a GitHub Release
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths:
      - "**.zip"
      - "native-android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: manager-native-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_ID: ${{ vars.APP_ID || 'com.krurdu.manager' }}
  APP_NAME: Maktabah Manager

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract latest Manager source
        run: |
          rm -rf _src _app
          mkdir _src

          ZIP=$(find . -type f -name 'KR_Urdu_Library_Manager_*.zip' \
            -not -path './_src/*' | sort | tail -1)

          test -n "$ZIP"

          unzip -q "$ZIP" -d _src

          IDX=$(find _src \
            -path '*/manager/index.html' \
            -not -path '*/node_modules/*' | head -1)

          test -n "$IDX"

          SRC_ROOT=$(dirname "$(dirname "$IDX")")
          echo "SRC_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"

      - name: Prepare native project
        run: |
          cp -R native-android _app

          mkdir -p _app/app/src/main/assets/www

          rsync -a \
            --exclude 'supabase' \
            "$SRC_ROOT/manager/" \
            _app/app/src/main/assets/www/

          sed -i \
            "s/__APP_ID__/$APP_ID/g" \
            _app/app/build.gradle.kts \
            _app/app/src/main/AndroidManifest.xml

          PKG_PATH=$(echo "$APP_ID" | tr . /)

          mkdir -p "_app/app/src/main/java/$PKG_PATH"

          mv \
            _app/app/src/main/java/com/krurdu/manager/MainActivity.kt \
            "_app/app/src/main/java/$PKG_PATH/MainActivity.kt"

          sed -i \
            "s/^package com\.krurdu\.manager/package $APP_ID/" \
            "_app/app/src/main/java/$PKG_PATH/MainActivity.kt"

      - name: Generate Gradle wrapper
        working-directory: _app
        run: |
          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin

      - name: Static verification
        working-directory: _app
        run: |
          grep -q 'USE_BIOMETRIC' \
            app/src/main/AndroidManifest.xml

          grep -q 'BiometricPrompt' \
            app/src/main/java/*/*/*/*/MainActivity.kt

          grep -q 'installSplashScreen' \
            app/src/main/java/*/*/*/*/MainActivity.kt

          grep -q 'androidBridge' \
            app/src/main/assets/www/applock.js

          grep -q 'androidBridge' \
            app/src/main/assets/www/native-shell.js

          test -f \
            app/src/main/assets/www/native-splash.png

          test -f \
            app/src/main/res/drawable/mk_splash.png

          test -f \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          node --check \
            app/src/main/assets/www/applock.js

          node --check \
            app/src/main/assets/www/native-shell.js

      - name: Build debug APK
        working-directory: _app
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK=$(find \
            _app/app/build/outputs/apk/debug \
            -name '*.apk' | head -1)

          test -n "$APK"

          AAPT=$(find \
            "$ANDROID_HOME/build-tools" \
            -name aapt | sort -V | tail -1)

          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt

          grep -q \
            "package: name='$APP_ID'" \
            /tmp/badging.txt

          grep -q \
            "application-label:'Maktabah Manager'" \
            /tmp/badging.txt

          unzip -l "$APK" | \
            grep -q 'assets/www/applock.js'

          unzip -l "$APK" | \
            grep -q 'assets/www/native-shell.js'

          mkdir -p dist

          OUT="Maktabah-Manager-native-v1.0.${GITHUB_RUN_NUMBER}.apk"

          cp "$APK" "dist/$OUT"

          echo "APK_FILE=dist/$OUT" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

          echo "APK_SHA=$(sha256sum "dist/$OUT" | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-native-build-${{ github.run_number }}
          name: Maktabah Manager Native v1.0.${{ github.run_number }}
          body: |
            Native Kotlin Android build.
            SHA-256: ${{ env.APK_SHA }}
          files: ${{ env.APK_FILE }}
          make_latest: true
