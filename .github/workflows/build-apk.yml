name: Build Maktabah Manager Native APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Optional: build this exact zip (e.g. Maktabah-Manager-Native-v3.zip). Empty = newest zip"
        type: string
        default: ""
      publish_release:
        description: Publish the APK as a GitHub Release
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: manager-native-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_ID: ${{ vars.APP_ID || 'com.krurdu.manager' }}
  APP_NAME: Maktabah Manager

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Find and unzip the latest zip
        env:
          FORCE_ZIP: ${{ inputs.zip_path }}
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys, zipfile
          env = os.environ["GITHUB_ENV"]

          def commit_time(path):
              out = subprocess.run(["git", "log", "-1", "--diff-filter=AM", "--format=%ct", "--", path],
                                   capture_output=True, text=True).stdout.strip()
              return int(out or 0)

          def useful(z):
              try:
                  names = zipfile.ZipFile(z).namelist()
              except Exception:
                  return False
              return any(n.endswith("manager/index.html") or "native-android/app/" in n for n in names)

          forced = os.environ.get("FORCE_ZIP", "").strip()
          if forced:
              if not os.path.isfile(forced): sys.exit("zip_path not found: " + forced)
              pick = forced
          else:
              zips = [z for z in glob.glob("**/*.zip", recursive=True)
                      if not z.startswith(("_src", "_app", "node_modules", ".")) and useful(z)]
              if not zips: sys.exit("No usable zip (with manager/ or native-android/) found in the repository.")
              nat = lambda z: [int(x) if x.isdigit() else x for x in re.split(r"(\d+)", os.path.basename(z).lower())]
              zips.sort(key=lambda z: (commit_time(z), nat(z)), reverse=True)
              print("Candidates (newest first):", *zips, sep="\n  ")
              pick = zips[0]

          os.makedirs("_src", exist_ok=True)
          subprocess.run(["unzip", "-q", "-o", pick, "-d", "_src"], check=True)

          web = [p for p in glob.glob("_src/**/manager/index.html", recursive=True) if "node_modules" not in p]
          nat_dirs = [p for p in glob.glob("_src/**/native-android/app/build.gradle.kts", recursive=True)]
          web_root = os.path.dirname(os.path.dirname(web[0])) if web else "."
          native = os.path.dirname(os.path.dirname(nat_dirs[0])) if nat_dirs else "native-android"
          if not web and not os.path.isfile("manager/index.html"): sys.exit("manager/index.html not found in the zip or the repo.")
          if not os.path.isfile(os.path.join(native, "app", "build.gradle.kts")): sys.exit("native-android project not found in the zip or the repo.")

          open(env, "a").write(f"ZIP_FILE={pick}\nWEB_ROOT={web_root}\nNATIVE_DIR={native}\n")
          summary = f"### Source\n- Zip: `{pick}`\n- Web: `{web_root}/manager`{' (from repo)' if not web else ''}\n- Native: `{native}`{' (from repo)' if not nat_dirs else ''}\n"
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(summary)
          print(summary)
          PY

      - name: Prepare native project
        run: |
          rm -rf _app && cp -R "$NATIVE_DIR" _app
          mkdir -p _app/app/src/main/assets/www
          rsync -a --exclude 'supabase' "$WEB_ROOT/manager/" _app/app/src/main/assets/www/
          sed -i "s/__APP_ID__/$APP_ID/g" _app/app/build.gradle.kts
          SRC_KT=$(find _app/app/src/main/java -name MainActivity.kt | head -1)
          DST_DIR="_app/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$DST_DIR"
          if [ "$(dirname "$SRC_KT")" != "$DST_DIR" ]; then mv "$SRC_KT" "$DST_DIR/MainActivity.kt"; fi
          sed -i -E "s/^package .*/package $APP_ID/" "$DST_DIR/MainActivity.kt"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        working-directory: _app
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Static checks
        working-directory: _app
        run: |
          KT=$(find app/src/main/java -name MainActivity.kt | head -1)
          grep -q 'USE_BIOMETRIC' app/src/main/AndroidManifest.xml
          grep -q 'FragmentActivity' "$KT"
          grep -q 'onShowFileChooser' "$KT"
          grep -q 'authenticateAsync' "$KT"
          grep -q 'authenticateAsync' app/src/main/assets/www/applock.js
          grep -q 'saveFile' app/src/main/assets/www/native-shell.js
          test -f app/src/main/assets/www/native-splash.png
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          node --check app/src/main/assets/www/applock.js
          node --check app/src/main/assets/www/native-shell.js

      - name: Stable signing key (cached)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: manager-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        working-directory: _app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find _app/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt | grep -E "^package:|application-label:"
          grep -q "package: name='$APP_ID'" /tmp/badging.txt
          grep -q "application-label:'Maktabah Manager'" /tmp/badging.txt
          unzip -l "$APK" | grep -q 'assets/www/applock.js'
          unzip -l "$APK" | grep -q 'assets/www/native-shell.js'
          mkdir -p dist
          OUT="Maktabah-Manager-native-v1.0.${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "dist/$OUT"
          echo "APK_FILE=dist/$OUT" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "APK_SHA=$(sha256sum "dist/$OUT" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-native-build-${{ github.run_number }}
          name: Maktabah Manager Native v1.0.${{ github.run_number }}
          body: |
            Native Kotlin Android build from `${{ env.ZIP_FILE }}`.
            SHA-256: ${{ env.APK_SHA }}
          files: ${{ env.APK_FILE }}
          make_latest: true
